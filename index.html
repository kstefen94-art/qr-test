<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>이미지 QR 발급</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #192b3a; background: #edf4f8; }
    body { margin: 0; padding: 5vh 1rem; }
    main { box-sizing: border-box; max-width: 52rem; margin: auto; background: white; padding: clamp(1.4rem, 6vw, 2.4rem); border-radius: 1rem; box-shadow: 0 9px 25px #193c5317; }
    h1 { font-size: 1.7rem; margin: 0 0 .6rem; }
    p { line-height: 1.6; color: #435666; }
    form { display: grid; gap: .7rem; margin-top: 1.5rem; }
    label { font-weight: 650; }
    input, button { box-sizing: border-box; width: 100%; border-radius: .5rem; padding: .75rem .85rem; font: inherit; }
    input { border: 1px solid #8b9ead; background: white; color: inherit; }
    button { margin-top: .55rem; background: #124d70; color: white; border: 0; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    fieldset { border: 0; padding: 0; margin: 0 0 1rem; min-width: 0; }
    legend { font-weight: 650; padding: 0; margin-bottom: .7rem; }
    #image-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .8rem; }
    .image-card { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .65rem; padding: .6rem; border: 2px solid #d7e2e9; border-radius: .8rem; cursor: pointer; font-weight: 500; }
    .image-card:has(input:checked) { border-color: #124d70; background: #edf6fc; }
    .image-card:focus-within { outline: 2px solid #467b9b; outline-offset: 3px; }
    .image-card img { grid-column: 1 / -1; display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: .45rem; background: #edf4f8; }
    .image-card input { width: 1.1rem; height: 1.1rem; margin: .1rem; padding: 0; accent-color: #124d70; }
    .image-card .image-error { grid-column: 1 / -1; color: #963b2c; font-size: .85rem; }
    #status { font-size: .9rem; margin: 0; }
    small { margin-top: .5rem; line-height: 1.55; color: #435666; }
  </style>
</head>
<body>
  <main>
    <h1>이미지 QR 발급</h1>
    <p>공유할 이미지를 고르고 이름과 사번을 입력해 주세요.</p>
    <form action="https://qr-issuer.kstefen94.workers.dev/issue" method="post" autocomplete="off">
      <fieldset id="image-fieldset" aria-describedby="status" disabled>
        <legend>이미지 선택</legend>
        <div id="image-options"></div>
      </fieldset>
      <p id="status" role="status" aria-live="polite">이미지 목록을 불러오는 중이에요.</p>
      <label for="employee-name">이름</label>
      <input id="employee-name" name="employee_name" maxlength="40" required>
      <label for="employee-number">사번</label>
      <input id="employee-number" name="employee_number" maxlength="32" pattern="[A-Za-z0-9_\-]{1,32}" title="영문, 숫자, 밑줄, 하이픈을 입력해 주세요" required>
      <button id="issue-button" type="submit" disabled>QR 발급</button>
      <small>이름·사번, 선택한 이미지와 발급 시각이 저장돼요. QR 링크를 열면 접속 시각과 IP 일부가 해당 이미지에 연결돼요.</small>
    </form>
  </main>
  <script type="module">
    const form = document.querySelector('form');
    const imageFieldset = document.querySelector('#image-fieldset');
    const imageOptions = document.querySelector('#image-options');
    const status = document.querySelector('#status');
    const issueButton = document.querySelector('#issue-button');
    imageOptions.addEventListener('change', () => {
      issueButton.disabled = !form.querySelector('input[name="image_id"]:checked:not(:disabled)');
      status.textContent = issueButton.disabled ? '이미지를 선택해 주세요.' : '';
    });

    try {
      const endpoint = new URL('/images', form.action);
      const response = await fetch(endpoint, { cache: 'no-store' });
      if (!response.ok) throw new Error('Image list unavailable');
      const payload = await response.json();
      if (!Array.isArray(payload.images)) throw new Error('Invalid image list');
      const images = payload.images.filter(image => {
        if (!image || typeof image.id !== 'string' || typeof image.name !== 'string' || typeof image.url !== 'string') return false;
        try {
          const url = new URL(image.url);
          return /^[A-Za-z0-9_-]{1,64}$/.test(image.id) &&
            url.origin === 'https://kstefen94-art.github.io' && url.pathname.startsWith('/qr-test/');
        } catch {
          return false;
        }
      });
      images.forEach(image => {
        const card = document.createElement('label');
        card.className = 'image-card';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'image_id';
        radio.value = image.id;
        radio.required = true;
        radio.disabled = true;
        const thumbnail = document.createElement('img');
        thumbnail.alt = image.name + ' 미리보기';
        thumbnail.addEventListener('load', () => { radio.disabled = false; });
        thumbnail.addEventListener('error', () => {
          const wasSelected = radio.checked;
          radio.disabled = true;
          radio.checked = false;
          const error = document.createElement('span');
          error.className = 'image-error';
          error.textContent = '이미지 파일을 열 수 없어요';
          card.append(error);
          if (wasSelected) {
            issueButton.disabled = true;
            status.textContent = '다른 이미지를 선택해 주세요.';
          }
        }, { once: true });
        const name = document.createElement('span');
        name.textContent = image.name;
        card.append(thumbnail, radio, name);
        imageOptions.append(card);
        thumbnail.src = image.url;
      });
      imageFieldset.disabled = images.length === 0;
      status.textContent = images.length ? '위에서 이미지를 선택해 주세요.' : '현재 발급할 수 있는 이미지가 없어요.';
    } catch {
      status.textContent = '이미지 목록을 불러올 수 없어요. 잠시 후 페이지를 새로고침해 주세요.';
    }
  </script>
</body>
</html>
